[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fastapi-fsp"
version = "0.6.0"
description = "Filter, sort, paginate and search FastAPI list endpoints with one dependency (SQLModel / SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Evert Jan Stamhuis", email = "ej@fromejdevelopment.nl" },
]
license = { text = "MIT" }
keywords = [
  "fastapi",
  "sqlmodel",
  "sqlalchemy",
  "pagination",
  "filtering",
  "sorting",
  "search",
  "full-text-search",
  "postgresql",
  "query-parameters",
  "rest",
  "api",
  "data-table",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Framework :: Pydantic :: 2",
  "Topic :: Database",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.121.1",
    "python-dateutil>=2.9.0.post0",
    "sqlmodel>=0.0.27",
]

[project.urls]
Homepage = "https://github.com/fromej-dev/fastapi-fsp"
Documentation = "https://fromej-dev.github.io/fastapi-fsp/"
Repository = "https://github.com/fromej-dev/fastapi-fsp"
Changelog = "https://github.com/fromej-dev/fastapi-fsp/blob/master/CHANGELOG.md"
Issues = "https://github.com/fromej-dev/fastapi-fsp/issues"
Releases = "https://github.com/fromej-dev/fastapi-fsp/releases"

[tool.hatch.build.targets.sdist]
include = ["/fastapi_fsp", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "build>=1.3.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.1.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]
docs = [
    "zensical>=0.0.71",
]

[tool.ruff]
line-length = 100
src = ["fastapi_fsp", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
